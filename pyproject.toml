[project]
name = "2d-gaussian-splatting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "diff-surfel-rasterization @ ${PROJECT_ROOT}/2d-gaussian-splatting/submodules/diff-surfel-rasterization",
  "lpips>=0.1.4",
  "mediapy>=1.2.3",
  "open3d>=0.19.0",
  "opencv-python>=4.11.0.86",
  "plyfile>=1.1",
  "scikit-image>=0.25.2",
  "simple-knn            @ ${PROJECT_ROOT}/2d-gaussian-splatting/submodules/simple-knn",
  "tqdm>=4.67.1",
  "trimesh>=4.6.8",
]

[build-system]
requires = ["setuptools>=61.0", "torch>=2.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "submodules" }
